name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  HUSKY: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  validate:
    name: "Validate & Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Code style and linting (PRs only)
      - name: Check code formatting
        run: bun prettier --check .
        if: github.event_name == 'pull_request'

      - name: Lint codebase
        run: bun lint
        if: github.event_name == 'pull_request'

      # Type checking (build email templates first for template types)
      - name: Build email templates for typecheck
        run: bun email:build

      - name: Typecheck
        run: bun typecheck

      # Unit Tests
      - name: Run unit tests
        run: bun run test -- --run

      # Build workspaces
      - name: Build workspaces
        run: |
          bun --filter @repo/email build
          bun --filter @repo/web build
          bun --filter @repo/api build
          bun --filter @repo/app build
        env:
          APP_NAME: "Drawmaid"
          APP_ORIGIN: "https://achuashwath.github.io"

      # Upload App build artifact for Preview deployment
      - name: Upload app build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: apps/app/dist

  preview:
    name: "Deploy Preview"
    needs: [validate]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download app build
        uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: apps/app/dist

      - name: Deploy PR Preview to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        id: cloudflare_deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/app/dist --project-name=drawmaid --branch=${{ github.head_ref }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Log preview status
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "Cloudflare secrets (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID) not configured in repo settings yet."
          echo "PR preview deployment skipped."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
